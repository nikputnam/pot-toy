			function checkerTexture() {
				const c = document.createElement( 'canvas' )
				c.width = 64
				c.height = 64
				const ctx = c.getContext( '2d' )
				ctx.fillStyle = '#eeeeee'
				ctx.fillRect( 0, 0, 64, 64 )
				ctx.fillStyle = '#444444'
				ctx.fillRect( 0, 0, 32, 32 )
				ctx.fillRect( 32, 32, 32, 32 )
				return new THREE.CanvasTexture( c )
			}

			function updateSurfaceImage() {
				surface_material.vertexColors = (params.scale_view != 'off')
				surface_material.toneMapped = (params.scale_view == 'off')   // keep the heat map colours true
				if (params.scale_view != 'off') {
					// the pattern size heat map (vertex colours) takes over from the image
					surface_material.map = null
					surface_material.color.setHex( 0xffffff )
				} else if (params.surface_image) {
					if (surface_image === null) { surface_image = checkerTexture() }
					surface_image.wrapS = THREE.RepeatWrapping
					surface_image.wrapT = THREE.RepeatWrapping
					// keep the image's aspect ratio: a wide image covers fewer turns vertically
					const img = surface_image.image
					const aspect = (img && img.width > 0 && img.height > 0) ? img.width/img.height : 1.0
					surface_image.repeat.set( params.image_repeat, params.image_repeat*aspect )
					surface_material.map = surface_image
					surface_material.color.setHex( 0xffffff )
				} else {
					surface_material.map = null
					surface_material.color.setHex( 0xaaaaaa )
				}
				surface_material.needsUpdate = true
			}

					const url = URL.createObjectURL( input.files[0] )

						URL.revokeObjectURL( url )
						if (surface_image !== null) { surface_image.dispose() }

						updateSurfaceImage()

			function sor( spline, squash ) {
				return function( u, v, pt ) {
					//console.log(spline);
				//	console.log(u,v,pt);
					
					//let r = spline.
					// = new THREE.Vector3();
					spline.getPoint( u, point );
					let r = point.x;
					let y = point.y;
					pt.x = r*Math.cos( v* Math.PI *2.0) ;
					pt.y = y;
					pt.z = squash*r*Math.sin( v* Math.PI *2.0);
				}
			}

			function facet( surf, n_facets, twist, puff ) {

				return function(u, v0, pt) {
				//	const pufff = 1.0/( ( 1+Math.exp(-30.0*(u-0.1)) )*(1+Math.exp(-30.0*(-u+0.9))) ) //min(1,10*u,10*(1-u)) ;
					//const pufff = (1-Math.exp(-u*20.0))*(1-Math.exp((-1+u)*20.0)); //min(1,10*u,10*(1-u)) ;
                   // taper at bottom only
					const pufff = (1-Math.exp(-u*10.0)); //min(1,10*u,10*(1-u)) ;
					const v = v0 + u*twist ;
					const phase = ( (v0) * n_facets)%1;
					const deltav = phase / n_facets;
					//const va =  (1.0/n_facets)* (     Math.floor( v * n_facets )) - ((u*twist)%1) ;
					//const vb =  (1.0/n_facets)* ( 1.0+Math.floor( v * n_facets )) - ((u*twist)%1) ;
					//const vb =  va + (1.0/n_facets);
					const va = v-deltav;
					const vb = va+(1.0/n_facets);
					const f = phase ; // ((v - va)%1) * n_facets; 
					surf(u,va,point1);
					surf(u,vb,point2);
					surf(u,v ,point3);
					pt.x = point3.x - pufff*(puff-1)*( point1.x + f*( point2.x - point1.x ) - point3.x);
					pt.y = point3.y - pufff*(puff-1)*( point1.y + f*( point2.y - point1.y ) - point3.y);
					pt.z = point3.z - pufff*(puff-1)*( point1.z + f*( point2.z - point1.z ) - point3.z);
//					pt.y = point1.y + f*( point2.y - point1.y );
//					pt.z = point1.z + f*( point2.z - point1.z );

				}
			}

			function bbox() {

				var fn =  sor(surface.spline, params.squash);
				if (params.facet == true) { 
					//log("faceting on: ", fn); 
					fn = facet(sor(surface.spline, params.squash), params.n_facets, params.twist, params.puff  ) ;
					//log("faceting on:- ", fn); 
				}

				const nu = surface.spline.points.length * 10
				const nv = 60 

				const du = 1.0/(nu-1)
				const dv = 1.0/(nv-1)

				const box = [...Array(nu).keys()].map( ui => ui*du).flatMap(
					function(u) {
						return [...Array(nv).keys()].map( vi => vi*dv).map( function(v){
							var p = new THREE.Vector3(0,0,0)
							fn(u,v,p)
							return p
						}
						)
					}

				).reduce( function( range,p ) {
					return( [
					[ Math.min(p.x,range[0][0]), Math.max(p.x,range[0][1]) ],
					[ Math.min(p.y,range[1][0]), Math.max(p.y,range[1][1]) ],
					[ Math.min(p.z,range[2][0]), Math.max(p.z,range[2][1]) ]
				
					] )
				} ,[[1.0e6,-1.0e6],[1.0e6,-1.0e6],[1.0e6,-1.0e6]]  )
				//console.log("bbox",box)
				return box
			}

			function evenly_spaced_samples( spline, samples,l, n ) {
				var times = []

				var ds = l/(n-1)
				var s = 0.0
				var s0 = samples[0][0]
				var i = 0
				var j=0
				var s0 = samples[j][1] 
				var s1 = samples[j+1][1]
				var t0 = samples[j][0] 
				var t1 = samples[j+1][0] 
				var dt = t1-t0
				var ss = s1-s0
				while (i<n) {
					while ((j<(samples.length-2)) && samples[j+1][1]<s) {
						j++; 
						s0 = samples[j][1] 
						s1 = samples[j+1][1]
						t0 = samples[j][0] 
						t1 = samples[j+1][0] 
						dt = t1-t0
						ss = s1-s0
					}
					const f = ( (s-s0)/ss )
					const u = t0 + f*dt
					//if (u>1.0) { console.log("u>1",i,s,u,j,samples.length,samples[j][0],samples[j][1], samples[j+1][0],samples[j+1][1]) }
					times.push(u)
					s += ds 
					i++
				}
				return(times)

			}


			function scale_factor() {
				const box = bbox()

				const height = Math.abs(box[1][1]-box[1][0])
				const width = Math.max( Math.abs(box[0][1]-box[0][0]), Math.abs(box[2][1]-box[2][0]))
				// expert override: scale so the printed height matches target_height,
				// ignoring the max_height / max_width box
				if (params.set_height) {
					return params.target_height / height
				}
				const height_scale = params.max_height / height 
				const width_scale = params.max_width / width
				const sf = Math.min( height_scale, width_scale ) 
				return sf
			}

			// Serpentine raster that fills the (squashed) disk of radius R at height y.
			// Rows run parallel to x, one line width apart. The path starts and ends at
			// the center so it joins the inward spiral before it and the outward spiral
			// after it. Each half of the disk (z >= 0, then z < 0) is covered as: half a
			// row out from the center, an arc along the perimeter up to the pole, a
			// serpentine back down through every row, and the other half of the first
			// row into the center. Rows are inset one line width on the side the arc
			// runs along, so nothing crosses.
			function bottomRaster(R, lw, y) {

				const zmax = params.squash * R
				const outer = function(k) {
					const zz = k*lw / params.squash
					return ( Math.abs(zz) < R ) ? Math.sqrt( R*R - zz*zz ) : 0.0
				}
				const dphi = 2.0*Math.PI / 360.0

				const pts = []
				const push = function(p) {
					if ( pts.length == 0 || pts[pts.length-1].distanceTo(p) > 1e-9 ) pts.push( p )
				}
				const pt = function(x, k) { push( new THREE.Vector3( x, y, k*lw ) ) }

				// h: row index of the half rows (0 for the +z half, -1 for the -z half)
				// s: direction of travel in z (+1 or -1)
				// a: side (+1 or -1 in x) the perimeter arc runs along
				const half = function(h, s, a) {
					// full rows k = h + s*j, j = 1 .. n, all inside the disk
					const n = Math.ceil( zmax/lw - Math.abs(h) ) - 1
					// row end on the arc side is inset one line width; the far side reaches the perimeter
					const end = function(k, side) { return ( side == a ) ? Math.max( 0.0, outer(k) - lw ) : outer(k) }
					// the last row visited (h+s) must end on the far side: n rows flip the side n times
					const start = ( n % 2 == 0 ) ? -a : a
					const K = h + s*n

					pt( 0.0, 0 )
					pt( 0.0, h )
					pt( a*end(h, a), h )

					// perimeter arc: x = a*R*cos(phi), z = zmax*sin(phi), from row h to the top row
					const phi_h = Math.asin( h*lw / zmax )
					const phi_K = Math.asin( K*lw / zmax )
					const phi_end = ( start == a ) ? phi_K : s*Math.PI - phi_K
					const n_arc = Math.max( 1, Math.ceil( Math.abs(phi_end - phi_h) / dphi ) )
					for (let i = 0; i <= n_arc; i++) {
						const phi = phi_h + (phi_end - phi_h) * i / n_arc
						push( new THREE.Vector3( a*R*Math.cos(phi), y, zmax*Math.sin(phi) ) )
					}

					var side = start
					for (let j = n; j >= 1; j--) {
						const k = h + s*j
						pt(  side*end(k,  side), k )
						pt( -side*end(k, -side), k )
						side = -side
					}
					pt( -a*end(h, -a), h )
					pt( 0.0, h )
					pt( 0.0, 0 )
				}

				half( 0, 1, 1 )
				half( -1, -1, -1 )

				return pts
			}

			function bottomPath(r0,total_length,scale_fact) {

				const length_samples = surface.spline.points.length * 10
				const dt = 1.0/(length_samples-1)
				const n_layers = Math.floor(total_length/(params.layer_height/scale_fact))
				const n_angular_steps = 1000
				const n = n_layers*n_angular_steps

				var p0 = new THREE.Vector3(0,0,0)

				//fn(0,0,p0)
				var p1 = p0.clone()

				p0.x = 0.0 
				p0.z = 0.0

				//const r0 = p0.distanceTo(p1)
				const lw = (params.line_width / scale_fact)
				r0 += params.line_width/scale_fact
				const turns = r0 / lw
				const ns = Math.floor(turns * n_angular_steps )
				console.log(ns,turns,lw,r0)
				const dtheta = 2*Math.PI / n_angular_steps
				var theta = -(turns % 1.0)*2.0*Math.PI
				var dr = r0 / ns
				var r = r0
				var yl = p0.y
				//console.log( "tail:",-lw*3*Math.sin(theta+Math.PI/2),p0.y, -lw*3*Math.cos(theta) )
				//const ptail = new THREE.Vector3( -lw*3*Math.sin(theta+Math.PI/2),p0.y, lw*3*Math.cos(theta+Math.PI/2) )
				const ptail = new THREE.Vector3( r*Math.cos(theta) -lw*3,p0.y, params.squash* r*Math.sin(theta) - 3*lw )
				var sp_in = [...Array(ns).keys()].map( x => x*dt).map(
					function(x) {
						var p = new THREE.Vector3( r*Math.cos(theta),yl,params.squash* r*Math.sin(theta) )
						theta += dtheta
						r -= dr
						return p
					}
				)
				// middle layer: back-and-forth raster filling the base
				yl += params.layer_height/scale_fact
				const raster = bottomRaster( r0 - lw/2.0, lw, yl )

				var theta = -(turns % 1.0)*2.0*Math.PI
				var r = 0
				//					yl *= 2.0 //params.layer_height
				yl += params.layer_height/scale_fact
				var sp_out = [...(Array(ns- Math.floor(params.line_width/scale_fact/dr)).keys()  )].map( x => x*dt).map(
					function(x) {
						var p = new THREE.Vector3( r*Math.cos(theta),yl,params.squash* r*Math.sin(theta) )
						theta += dtheta
						r += dr
						return p
					}
				)
				return [ptail].concat( sp_in, raster, sp_out )

			}

			// Closed-form conformal map for a surface of revolution. Returns U(u), the
			// conformal height coordinate in turns: U = (1/2pi) * integral of ds / r along
			// the profile (a Mercator-style map). A pattern with the same number of
			// periods in U as in v (turns around the pot) has square cells everywhere.
			// squash is handled approximately by using the radius of the circle with the
			// same circumference as the ellipse; facets are ignored.
			function conformalMap( spline, squash ) {

				const n = 400
				const pts = [...Array(n+1).keys()].map( i => spline.getPoint( i/n ).clone() )
				const rmax = pts.reduce( (a,p) => Math.max(a,Math.abs(p.x)), 0.0 )
				// r goes to zero if the first control point is on the axis; clamp so the integral stays finite
				const rmin = 0.01*rmax
				// Ramanujan's approximation to the ellipse circumference, over 2 pi r
				const rfact = ( 3.0*(1.0+squash) - Math.sqrt( (3.0+squash)*(1.0+3.0*squash) ) ) / 2.0

				const U = [0.0]
				for (let i = 1; i <= n; i++) {
					const ds = pts[i].distanceTo( pts[i-1] )
					const r = Math.max( rmin, rfact*0.5*( Math.abs(pts[i].x) + Math.abs(pts[i-1].x) ) )
					U.push( U[i-1] + ds/(2.0*Math.PI*r) )
				}

				return function(u) {
					const x = Math.min( Math.max(u,0.0), 1.0 ) * n
					const i = Math.min( Math.floor(x), n-1 )
					return U[i] + (x-i)*( U[i+1] - U[i] )
				}
			}

			// Solve N z = rhs for a symmetric positive definite banded matrix, by banded
			// Cholesky (N = L L^T, in place) then forward and back substitution.
			// Storage is the lower band: entry (r,c), r-bw <= c <= r, is at r*(bw+1) + (c-r+bw).
			// N and rhs are overwritten; rhs is returned holding the solution.
			function bandedSolve( N, rhs, n, bw ) {
				bandedFactor( N, n, bw )
				return bandedSubstitute( N, rhs, n, bw )
			}

			function bandedFactor( N, n, bw ) {
				const w = bw+1
				for (let r = 0; r < n; r++) {
					const c0 = Math.max( 0, r-bw )
					for (let c = c0; c <= r; c++) {
						let sum = N[ r*w + (c-r+bw) ]
						for (let m = c0; m < c; m++) {
							sum -= N[ r*w + (m-r+bw) ] * N[ c*w + (m-c+bw) ]
						}
						if (c == r) {
							N[ r*w + bw ] = Math.sqrt( Math.max( sum, 1e-12 ) )
						} else {
							N[ r*w + (c-r+bw) ] = sum / N[ c*w + bw ]
						}
					}
				}
			}

			// N must already be factored by bandedFactor
			function bandedSubstitute( N, rhs, n, bw ) {
				const w = bw+1
				const z = rhs
				for (let r = 0; r < n; r++) {
					let sum = z[r]
					for (let m = Math.max(0,r-bw); m < r; m++) { sum -= N[ r*w + (m-r+bw) ]*z[m] }
					z[r] = sum / N[ r*w + bw ]
				}
				for (let r = n-1; r >= 0; r--) {
					let sum = z[r]
					for (let m = r+1; m <= Math.min(n-1,r+bw); m++) { sum -= N[ m*w + (r-m+bw) ]*z[m] }
					z[r] = sum / N[ r*w + bw ]
				}
				return z
			}

			// Least-squares conformal map (LSCM) of the surface fn(u,v,pt), for shapes where
			// the closed form above is not conformal (squash, facets). Solved on a coarse
			// nu x nv grid and interpolated, since conformal maps are smooth.
			//
			// Unknowns are (x,y) per grid vertex: x = turns around the pot, y = conformal
			// height in the same units. The grid is periodic in v: column nv is column 0
			// with x + 1, which is built into the equations (the +1 goes to the right hand
			// side), so there is no seam and no seam constraint. That jump fixes the scale
			// of the map; the boundary conditions further down fix the rest.
			//
			// Each triangle contributes two rows (real and imaginary part) of
			//     sum_k W_k z_k / sqrt(2 area) = 0 ,   z = x + iy ,
			// where W_k is the edge opposite corner k in the triangle's own flat 2D frame,
			// as a complex number. The normal equations are assembled directly into a
			// banded matrix and solved by banded Cholesky. Vertices are numbered ring by
			// ring, with each ring folded (0, nv-1, 1, nv-2, ...) so that the periodic
			// wrap does not widen the band.
			//
			// Returns function(u, v, out) that sets out.x, out.y.
			function lscmMap( fn, nu, nv ) {

				const nverts = (nu+1)*nv
				const n = 2*nverts
				const fold = j => ( 2*j < nv ) ? 2*j : 2*(nv-1-j) + 1
				const vid = (i,j) => i*nv + fold(j)
				const bw = 2*(nv+2) + 1   // half bandwidth
				const w = bw+1

				const P = []
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) {
						const p = new THREE.Vector3()
						fn( i/nu, j/nv, p )
						P.push( p )
					}
				}

				// lower band storage: entry (r,c), r-bw <= c <= r, is at r*w + (c-r+bw)
				const N = new Float64Array( n*w )
				const rhs = new Float64Array( n )
				const e1 = new THREE.Vector3()
				const e2 = new THREE.Vector3()
				const idx = [0,0,0,0,0,0]
				const re = [0,0,0,0,0,0]
				const im = [0,0,0,0,0,0]

				// corners are [i,j] with j possibly equal to nv (the wrapped column)
				function addTriangle( c0, c1, c2 ) {
					const cs = [c0,c1,c2]
					const p = cs.map( c => P[ c[0]*nv + (c[1]%nv) ] )
					e1.subVectors( p[1], p[0] )
					e2.subVectors( p[2], p[0] )
					const l = e1.length()
					if (!(l > 0.0)) { return }
					const a = e2.dot(e1)/l
					const b = Math.sqrt( Math.max( 0.0, e2.lengthSq() - a*a ) )
					const area = 0.5*l*b
					if (!(area > 1e-12*l*l)) { return }   // degenerate, e.g. bottom ring collapsed onto the axis
					const s = 1.0/Math.sqrt( 2.0*area )
					// local frame: p0=(0,0) p1=(l,0) p2=(a,b); W_k = opposite edge
					const wr = [ (a-l)*s, -a*s, l*s ]
					const wi = [ b*s, -b*s, 0.0 ]
					let cre = 0.0, cim = 0.0
					for (let k = 0; k < 3; k++) {
						const v = vid( cs[k][0], cs[k][1]%nv )
						idx[2*k] = 2*v ; idx[2*k+1] = 2*v+1
						re[2*k] = wr[k] ; re[2*k+1] = -wi[k]
						im[2*k] = wi[k] ; im[2*k+1] =  wr[k]
						if (cs[k][1] == nv) { cre += wr[k] ; cim += wi[k] }   // x + 1 across the wrap
					}
					for (let q = 0; q < 6; q++) {
						rhs[idx[q]] -= re[q]*cre + im[q]*cim
						for (let r = 0; r < 6; r++) {
							if (idx[r] <= idx[q]) { N[ idx[q]*w + (idx[r]-idx[q]+bw) ] += re[q]*re[r] + im[q]*im[r] }
						}
					}
				}

				for (let i = 0; i < nu; i++) {
					for (let j = 0; j < nv; j++) {
						addTriangle( [i,j], [i+1,j], [i+1,j+1] )
						addTriangle( [i,j], [i+1,j+1], [i,j+1] )
					}
				}
				// Boundary conditions. Conformality and the period alone leave the map far from
				// unique (z + c*exp(2 pi i k z) is just as conformal for any c, k), which shows
				// up as wavy rim and foot lines. The map onto a straight strip is unique: hold
				// y = 0 on the bottom ring and y = (one free constant) on the top ring, with
				// stiff penalties that stay inside the band. x(0,0) = 0 fixes the rotation.
				const stiff = 1.0e4
				N[ 0*w + bw ] += 1.0
				for (let j = 0; j < nv; j++) {
					const yb = 2*vid(0,j) + 1
					N[ yb*w + bw ] += stiff
					const ya = 2*vid(nu,j) + 1
					const yc = 2*vid(nu,(j+1)%nv) + 1
					const hi = Math.max(ya,yc), lo = Math.min(ya,yc)
					N[ ya*w + bw ] += stiff
					N[ yc*w + bw ] += stiff
					N[ hi*w + (lo-hi+bw) ] -= stiff
				}

				const z = bandedSolve( N, rhs, n, bw )

				// the orientation of the triangles decides whether y runs up or down the pot; make it up
				const ysign = ( z[ 2*vid(nu,0)+1 ] < z[ 2*vid(0,0)+1 ] ) ? -1.0 : 1.0

				return function( u, v, out ) {
					const fi = Math.min( Math.max(u,0.0), 1.0 ) * nu
					const i = Math.min( Math.floor(fi), nu-1 )
					const fj = Math.min( Math.max(v,0.0), 1.0 ) * nv
					const j = Math.min( Math.floor(fj), nv-1 )
					const s = fi-i
					const t = fj-j
					const wrap = (j+1 == nv) ? 1.0 : 0.0
					const k00 = 2*vid(i,j), k10 = 2*vid(i+1,j), k01 = 2*vid(i,(j+1)%nv), k11 = 2*vid(i+1,(j+1)%nv)
					out.x = (1-s)*( (1-t)*z[k00] + t*(z[k01]+wrap) ) + s*( (1-t)*z[k10] + t*(z[k11]+wrap) )
					out.y = ysign*( (1-s)*( (1-t)*z[k00+1] + t*z[k01+1] ) + s*( (1-t)*z[k10+1] + t*z[k11+1] ) )
				}
			}

			// Cone metric (experiment). A conformal map scales the pattern by exp(phi), and
			// phi cannot be constant on a curved pot: it obeys  laplacian(phi) = K, the
			// Gaussian curvature. The way to keep the pattern one size nearly everywhere is
			// to flatten onto a surface whose curvature all sits in a few cone points with
			// angles the pattern lattice allows: multiples of q = 2 pi / order (order 4 =
			// square lattice, where 3 or 5 squares meet at a cone instead of 4). Then
			//     L phi = Ktarget - Korig
			// with L the cotangent Laplacian, Korig the discrete curvature of the mesh
			// (2 pi - angle sum; pi - angle sum on the foot and rim rings, i.e. how much the
			// boundary turns) and Ktarget zero except at the cones and on the boundary.
			//
			// Cone placement uses the fact that the curvature of a pot is organised by height:
			// walk up the rings accumulating Korig, round the running total to a multiple of
			// q, and put a cone on the ring wherever the rounded total steps. The foot and
			// rim get the rounded boundary turning, spread along their length, so the pattern
			// also closes up around the pot after a whole number of lattice rotations.
			// Around the ring, successive cones are spaced by the golden angle.
			//
			// This computes only the scale factor and the cones; coneLayout() makes the uv map.
			// Returns { phi: function(u,v), cones: [ { p: Vector3, sign: +1 or -1, i, j } ], ... }.
			// phi has zero area-weighted mean. Pattern size on the pot goes as exp(-phi).
			function coneMetric( fn, nu, nv, order ) {

				const n = (nu+1)*nv
				const fold = j => ( 2*j < nv ) ? 2*j : 2*(nv-1-j) + 1
				const vid = (i,j) => i*nv + fold(j)
				const bw = nv+2
				const w = bw+1
				const q = 2.0*Math.PI/order

				const P = []
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) {
						const p = new THREE.Vector3()
						fn( i/nu, j/nv, p )
						P.push( p )
					}
				}

				// triangles as corner triples, both as solver index (vid) and grid id
				const tv = [], tg = []
				for (let i = 0; i < nu; i++) {
					for (let j = 0; j < nv; j++) {
						for (const c of [ [[i,j],[i+1,j],[i+1,j+1]], [[i,j],[i+1,j+1],[i,j+1]] ]) {
							for (const [ci,cj] of c) { tv.push( vid(ci,cj%nv) ) ; tg.push( ci*nv + cj%nv ) }
						}
					}
				}
				const nT = tv.length/3
				const len0 = new Float64Array( 3*nT )   // len0[3T+k] is the edge opposite corner k
				for (let T = 0; T < nT; T++) {
					for (let k = 0; k < 3; k++) { len0[3*T+k] = P[tg[3*T+(k+1)%3]].distanceTo( P[tg[3*T+(k+2)%3]] ) }
				}
				const full = new Float64Array( n )
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) { full[vid(i,j)] = ( i == 0 || i == nu ) ? Math.PI : 2.0*Math.PI }
				}

				// Curvature and cotangent Laplacian of the mesh with edges rescaled by phi:
				// l' = l exp( (phi_a + phi_b)/2 ).
				const area = new Float64Array( n )
				function assemble( phi, wantArea ) {
					const L = new Float64Array( n*w )
					const K = new Float64Array( full )
					const len = [0,0,0]
					for (let T = 0; T < nT; T++) {
						const v = [ tv[3*T], tv[3*T+1], tv[3*T+2] ]
						for (let k = 0; k < 3; k++) { len[k] = len0[3*T+k]*Math.exp( 0.5*( phi[v[(k+1)%3]] + phi[v[(k+2)%3]] ) ) }
						const sp = 0.5*( len[0]+len[1]+len[2] )
						const a = Math.sqrt( Math.max( 0.0, sp*(sp-len[0])*(sp-len[1])*(sp-len[2]) ) )
						if (!(a > 1e-12*sp*sp)) {
							// collapsed, or the rescaled lengths no longer make a triangle: the corner
							// opposite the over-long edge takes the whole angle pi
							for (let k = 0; k < 3; k++) { if (len[k] >= sp && sp > 0.0) { K[v[k]] -= Math.PI } }
							continue
						}
						for (let k = 0; k < 3; k++) {
							const l1 = len[(k+1)%3], l2 = len[(k+2)%3]
							const cosk = Math.min( 1.0, Math.max( -1.0, (l1*l1 + l2*l2 - len[k]*len[k])/(2.0*l1*l2) ) )
							K[v[k]] -= Math.acos( cosk )
							if (wantArea) { area[v[k]] += a/3.0 }
							// cotangent weight on the opposite edge. It can be negative (obtuse corner), but
							// each triangle's block is still positive semidefinite, so L is too, and
							// using it unclamped is what makes this the exact Hessian for Newton.
							const wt = 0.5*cosk/Math.sqrt( Math.max( 1e-12, 1.0-cosk*cosk ) )
							const va = v[(k+1)%3], vb = v[(k+2)%3]
							const hi = Math.max(va,vb), lo = Math.min(va,vb)
							L[ va*w + bw ] += wt
							L[ vb*w + bw ] += wt
							L[ hi*w + (lo-hi+bw) ] -= wt
						}
					}
					return { L: L, K: K }
				}

				let phi = new Float64Array( n )
				let cur = assemble( phi, true )
				const Korig = cur.K
				const ringK = new Float64Array( nu+1 )
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) {
						const v = vid(i,j)
						if (!(area[v] > 0.0)) { Korig[v] = 0.0 }   // vertex with no real triangles
						ringK[i] += Korig[v]
					}
				}

				// quantize the running total of curvature, ring by ring
				const Ktarget = new Float64Array( n )
				const cones = []
				const golden = 0.6180339887498949
				let S = 0.0, Qlast = 0.0, ncone = 0
				for (let i = 0; i <= nu; i++) {
					S += ringK[i]
					// the last ring takes whatever is left, so that Ktarget and Korig have the same total
					const Q = (i == nu) ? S : q*Math.round( S/q )
					const t = Q - Qlast
					Qlast = Q
					if (i == 0 || i == nu) {
						// boundary turning, spread in proportion to length along the ring
						const len = []
						let total = 0.0
						for (let j = 0; j < nv; j++) {
							const l = P[i*nv+j].distanceTo( P[i*nv+(j+1)%nv] ) + P[i*nv+j].distanceTo( P[i*nv+(j+nv-1)%nv] )
							len.push( l )
							total += l
						}
						for (let j = 0; j < nv; j++) {
							Ktarget[ vid(i,j) ] += (total > 0.0) ? t*len[j]/total : t/nv
						}
					} else {
						const count = Math.round( Math.abs(t)/q )
						const sign = (t > 0.0) ? 1.0 : -1.0
						for (let c = 0; c < count; c++) {
							ncone += 1
							let j = Math.floor( ( (ncone*golden) % 1.0 )*nv ) % nv
							while (Ktarget[ vid(i,j) ] != 0.0) { j = (j+1) % nv }
							Ktarget[ vid(i,j) ] = sign*q
							cones.push( { p: P[i*nv+j].clone(), sign: sign, i: i, j: j } )
						}
					}
				}

				// Newton's method on the (convex) discrete conformal energy: each step solves
				// L delta = Ktarget - K(phi) with the Laplacian of the current rescaled mesh.
				// L is singular (constants); the right hand side sums to zero, so pinning one
				// value costs nothing. The first step alone is the linear estimate; the later
				// ones make the rescaled mesh flat (to 1e-4 radians), which is what lets
				// coneLayout() unfold it consistently.
				const resid = function( K ) {
					let m = 0.0
					for (let v = 0; v < n; v++) { if (area[v] > 0.0) { m = Math.max( m, Math.abs( Ktarget[v]-K[v] ) ) } }
					return m
				}
				let err = resid( cur.K )
				for (let it = 0; it < 8 && err > 1e-4; it++) {   // converges quadratically; usually 3 steps
					const rhs = new Float64Array( n )
					for (let v = 0; v < n; v++) { rhs[v] = (area[v] > 0.0) ? Ktarget[v] - cur.K[v] : 0.0 }
					cur.L[ 0*w + bw ] += 1.0
					const delta = bandedSolve( cur.L, rhs, n, bw )
					// back off if a full step makes things worse
					let step = 1.0
					for (;;) {
						const trial = new Float64Array( n )
						for (let v = 0; v < n; v++) { trial[v] = phi[v] + step*delta[v] }
						const next = assemble( trial, false )
						const e = resid( next.K )
						if (e < err || step < 0.1) { phi = trial ; cur = next ; err = e ; break }
						step *= 0.5
					}
				}
				let asum = 0.0, psum = 0.0
				for (let v = 0; v < n; v++) { asum += area[v] ; psum += area[v]*phi[v] }
				for (let v = 0; v < n; v++) { phi[v] -= psum/asum }

				// the grid itself, for coneLayout(): values by grid id i*nv + j
				const phig = new Float64Array( n )
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) { phig[i*nv+j] = phi[vid(i,j)] }
				}

				return {
					cones: cones,
					nu: nu, nv: nv, P: P, phig: phig,
					residual: err,   // largest remaining curvature error, radians
					phi: function( u, v ) {
						const fi = Math.min( Math.max(u,0.0), 1.0 ) * nu
						const i = Math.min( Math.floor(fi), nu-1 )
						const fj = Math.min( Math.max(v,0.0), 1.0 ) * nv
						const j = Math.min( Math.floor(fj), nv-1 )
						const s = fi-i
						const t = fj-j
						const j1 = (j+1)%nv
						return (1-s)*( (1-t)*phi[vid(i,j)] + t*phi[vid(i,j1)] ) + s*( (1-t)*phi[vid(i+1,j)] + t*phi[vid(i+1,j1)] )
					}
				}
			}

			// Lay the cone metric out flat (experiment, first stage: seams are not yet matched up).
			//
			//  1. Rescale every edge: l' = l * exp( (phi_a + phi_b)/2 ). The rescaled mesh is
			//     flat except at the cones.
			//  2. Cut it open into a disk: one seam up column 0, plus a slit along its ring
			//     from the seam to each cone. Vertices on a cut are duplicated; how many copies
			//     each needs falls out of a union-find over triangle corners joined across
			//     uncut edges.
			//  3. Unfold: walk from triangle to triangle across uncut edges, carrying the
			//     rotation theta that places each triangle's own flat drawing in the plane.
			//  4. Solve for the uv of the cut vertices in the least squares sense,
			//         sum over triangle edges  w | uv_b - uv_a - R(theta) e' |^2 ,
			//     with cotangent weights w. This is a Poisson problem with the same matrix
			//     for x and y, so it is factored once. It spreads out the small inconsistency
			//     left by step 1 being a linearization.
			//
			// uv is divided by the mean circumference so that, as with the other maps, one
			// unit is roughly one turn. Returns { geometry, param_uv }: the cut mesh as an
			// indexed BufferGeometry, and the surface parameters (u,v) of each of its vertices.
			function coneLayout( cm ) {

				const nu = cm.nu, nv = cm.nv, P = cm.P, phig = cm.phig
				const ng = (nu+1)*nv
				const gid = (i,j) => i*nv + (j%nv)

				// triangles, wound so that in the plane v runs along +x and u along +y
				const tri = []
				for (let i = 0; i < nu; i++) {
					for (let j = 0; j < nv; j++) {
						const a = gid(i,j), b = gid(i,j+1), c = gid(i+1,j), d = gid(i+1,j+1)
						tri.push( a,b,d, a,d,c )
					}
				}
				const nT = tri.length/3

				const ekey = (a,b) => (a < b) ? a*ng+b : b*ng+a
				const cut = new Set()
				for (let i = 0; i < nu; i++) { cut.add( ekey( gid(i,0), gid(i+1,0) ) ) }
				for (const c of cm.cones) {
					// the shorter way round the ring to the seam
					const j0 = (2*c.j <= nv) ? 0 : c.j
					const j1 = (2*c.j <= nv) ? c.j : nv
					for (let j = j0; j < j1; j++) { cut.add( ekey( gid(c.i,j), gid(c.i,j+1) ) ) }
				}

				// adjacency across uncut edges; edge k of a triangle runs from corner k to corner k+1
				const adj = new Int32Array( 3*nT ).fill( -1 )
				const parent = new Int32Array( 3*nT )
				for (let c = 0; c < 3*nT; c++) { parent[c] = c }
				function find(c) {
					while (parent[c] != c) { parent[c] = parent[parent[c]] ; c = parent[c] }
					return c
				}
				const seen = new Map()
				for (let T = 0; T < nT; T++) {
					for (let k = 0; k < 3; k++) {
						const key = ekey( tri[3*T+k], tri[3*T+(k+1)%3] )
						if (cut.has(key)) { continue }
						if (!seen.has(key)) { seen.set( key, 3*T+k ) ; continue }
						const other = seen.get(key)
						const T2 = Math.floor(other/3), k2 = other%3
						adj[3*T+k] = other
						adj[other] = 3*T+k
						// the shared edge runs opposite ways in the two triangles
						parent[ find(3*T+k) ] = find( 3*T2+(k2+1)%3 )
						parent[ find(3*T+(k+1)%3) ] = find( 3*T2+k2 )
					}
				}

				// each triangle drawn flat in its own frame, from the rescaled edge lengths:
				// corner 0 at the origin, corner 1 on the +x axis
				const q = new Float64Array( 6*nT )
				for (let T = 0; T < nT; T++) {
					const g = [ tri[3*T], tri[3*T+1], tri[3*T+2] ]
					let l01 = P[g[0]].distanceTo(P[g[1]]), l12 = P[g[1]].distanceTo(P[g[2]]), l20 = P[g[2]].distanceTo(P[g[0]])
					const s01 = Math.exp( 0.5*(phig[g[0]]+phig[g[1]]) ), s12 = Math.exp( 0.5*(phig[g[1]]+phig[g[2]]) ), s20 = Math.exp( 0.5*(phig[g[2]]+phig[g[0]]) )
					if ( l01*s01 < l12*s12 + l20*s20 && l12*s12 < l20*s20 + l01*s01 && l20*s20 < l01*s01 + l12*s12 ) {
						l01 *= s01 ; l12 *= s12 ; l20 *= s20
					} else {
						// right at a cone the rescaled lengths can fail to make a triangle; keep the shape, scale it
						const sm = Math.exp( (phig[g[0]]+phig[g[1]]+phig[g[2]])/3.0 )
						l01 *= sm ; l12 *= sm ; l20 *= sm
					}
					const x = (l01 > 0.0) ? (l01*l01 + l20*l20 - l12*l12)/(2.0*l01) : 0.0
					q[6*T+2] = l01
					q[6*T+4] = x
					q[6*T+5] = Math.sqrt( Math.max( 0.0, l20*l20 - x*x ) )
				}

				// unfold: breadth first from triangle 0, whose frame already has v along +x
				const theta = new Float64Array( nT )
				const visited = new Uint8Array( nT )
				const queue = [0]
				visited[0] = 1
				for (let h = 0; h < queue.length; h++) {
					const T = queue[h]
					for (let k = 0; k < 3; k++) {
						if (adj[3*T+k] < 0) { continue }
						const T2 = Math.floor(adj[3*T+k]/3), k2 = adj[3*T+k]%3
						if (visited[T2]) { continue }
						const k1 = (k+1)%3, k3 = (k2+1)%3
						const alpha = theta[T] + Math.atan2( q[6*T+2*k1+1]-q[6*T+2*k+1], q[6*T+2*k1]-q[6*T+2*k] )
						const beta = Math.atan2( q[6*T2+2*k3+1]-q[6*T2+2*k2+1], q[6*T2+2*k3]-q[6*T2+2*k2] )
						theta[T2] = alpha - beta - Math.PI
						visited[T2] = 1
						queue.push( T2 )
					}
				}

				// number the cut vertices ring by ring, folded, as in lscmMap(), so the matrix is banded
				const fold = j => ( 2*j < nv ) ? 2*j : 2*(nv-1-j) + 1
				const roots = []
				for (let c = 0; c < 3*nT; c++) { if (find(c) == c) { roots.push(c) } }
				const rank = c => Math.floor(tri[c]/nv)*nv + fold( tri[c]%nv )
				roots.sort( (a,b) => rank(a)-rank(b) )
				const cvOfRoot = new Map()
				roots.forEach( (c,idx) => cvOfRoot.set(c,idx) )
				const n = roots.length
				const cv = new Int32Array( 3*nT )
				let bw = 1
				for (let c = 0; c < 3*nT; c++) { cv[c] = cvOfRoot.get( find(c) ) }
				for (let T = 0; T < nT; T++) {
					for (let k = 0; k < 3; k++) { bw = Math.max( bw, Math.abs( cv[3*T+k] - cv[3*T+(k+1)%3] ) ) }
				}
				const w = bw+1

				const N = new Float64Array( n*w )
				const X = new Float64Array( n )
				const Y = new Float64Array( n )
				for (let T = 0; T < nT; T++) {
					const ct = Math.cos(theta[T]), st = Math.sin(theta[T])
					for (let k = 0; k < 3; k++) {
						const k1 = (k+1)%3, k2 = (k+2)%3
						// cotangent at the corner opposite this edge
						const ax = q[6*T+2*k]-q[6*T+2*k2], ay = q[6*T+2*k+1]-q[6*T+2*k2+1]
						const bx = q[6*T+2*k1]-q[6*T+2*k2], by = q[6*T+2*k1+1]-q[6*T+2*k2+1]
						const crs = Math.abs( ax*by - ay*bx )
						const wt = (crs > 0.0) ? 0.5*(ax*bx + ay*by)/crs : 0.0
						const ex = q[6*T+2*k1]-q[6*T+2*k], ey = q[6*T+2*k1+1]-q[6*T+2*k+1]
						const dx = ct*ex - st*ey, dy = st*ex + ct*ey
						const va = cv[3*T+k], vb = cv[3*T+k1]
						const hi = Math.max(va,vb), lo = Math.min(va,vb)
						N[ va*w + bw ] += wt
						N[ vb*w + bw ] += wt
						N[ hi*w + (lo-hi+bw) ] -= wt
						X[va] -= wt*dx ; X[vb] += wt*dx
						Y[va] -= wt*dy ; Y[vb] += wt*dy
					}
				}
				N[ 0*w + bw ] += 1.0   // pin one vertex; the right hand sides sum to zero
				bandedFactor( N, n, bw )
				bandedSubstitute( N, X, n, bw )
				bandedSubstitute( N, Y, n, bw )

				let cref = 0.0
				for (let i = 0; i <= nu; i++) {
					for (let j = 0; j < nv; j++) { cref += P[gid(i,j)].distanceTo( P[gid(i,j+1)] ) }
				}
				cref /= (nu+1)

				// smooth normals from the uncut grid, so the cuts do not show in the shading
				const normal = []
				for (let g = 0; g < ng; g++) { normal.push( new THREE.Vector3() ) }
				const e1 = new THREE.Vector3(), e2 = new THREE.Vector3()
				for (let T = 0; T < nT; T++) {
					e1.subVectors( P[tri[3*T+1]], P[tri[3*T]] )
					e2.subVectors( P[tri[3*T+2]], P[tri[3*T]] )
					e1.cross( e2 )
					for (let k = 0; k < 3; k++) { normal[tri[3*T+k]].add( e1 ) }
				}

				const positions = new Float32Array( 3*n )
				const normals = new Float32Array( 3*n )
				const uvs = new Float32Array( 2*n )
				const param_uv = new Float32Array( 2*n )
				roots.forEach( function(c,idx) {
					const g = tri[c]
					normal[g].normalize()
					positions.set( [ P[g].x, P[g].y, P[g].z ], 3*idx )
					normals.set( [ normal[g].x, normal[g].y, normal[g].z ], 3*idx )
					uvs.set( [ X[idx]/cref, Y[idx]/cref ], 2*idx )
					param_uv.set( [ Math.floor(g/nv)/nu, (g%nv)/nv ], 2*idx )
				} )
				const geometry = new THREE.BufferGeometry()
				geometry.setAttribute( 'position', new THREE.BufferAttribute( positions, 3 ) )
				geometry.setAttribute( 'normal', new THREE.BufferAttribute( normals, 3 ) )
				geometry.setAttribute( 'uv', new THREE.BufferAttribute( uvs, 2 ) )
				geometry.setIndex( Array.from( cv ) )
				return { geometry: geometry, param_uv: param_uv }
			}

			const CONE_U = 40
			const CONE_V = 90

			// log scale factor of the uv map currently on a geometry, per vertex: half the log
			// of (uv area / surface area) of the surrounding triangles, mean removed.
			function uvLogScale( geometry ) {
				const pos = geometry.attributes.position
				const uv = geometry.attributes.uv
				const index = geometry.index
				const sum = new Float64Array( pos.count )
				const wsum = new Float64Array( pos.count )
				const p = [ new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3() ]
				const e1 = new THREE.Vector3()
				const e2 = new THREE.Vector3()
				for (let t = 0; t < index.count; t += 3) {
					const id = [ index.getX(t), index.getX(t+1), index.getX(t+2) ]
					for (let k = 0; k < 3; k++) { p[k].fromBufferAttribute( pos, id[k] ) }
					e1.subVectors( p[1], p[0] )
					e2.subVectors( p[2], p[0] )
					const a3 = 0.5*e1.cross(e2).length()
					const ux = uv.getX(id[1]) - uv.getX(id[0]), uy = uv.getY(id[1]) - uv.getY(id[0])
					const vx = uv.getX(id[2]) - uv.getX(id[0]), vy = uv.getY(id[2]) - uv.getY(id[0])
					const a2 = 0.5*Math.abs( ux*vy - uy*vx )
					if (!(a3 > 0.0 && a2 > 0.0)) { continue }
					const f = 0.5*Math.log( a2/a3 )
					for (let k = 0; k < 3; k++) { sum[id[k]] += a3*f ; wsum[id[k]] += a3 }
				}
				let asum = 0.0, psum = 0.0
				for (let i = 0; i < pos.count; i++) {
					if (wsum[i] > 0.0) { sum[i] /= wsum[i] }
					asum += wsum[i] ; psum += wsum[i]*sum[i]
				}
				for (let i = 0; i < pos.count; i++) { sum[i] -= psum/asum }
				return { phi: sum, weight: wsum }
			}

			// Colour the mesh by pattern size exp(-phi) relative to the average: white is
			// average, red is larger, blue is smaller, saturating at double and half.
			// Returns a short summary for the GUI.
			function paintLogScale( geometry, phi, weight ) {
				const colors = new Float32Array( 3*phi.length )
				for (let i = 0; i < phi.length; i++) {
					const t = Math.min( 1.0, Math.max( -1.0, -phi[i]/Math.LN2 ) )
					const a = Math.abs(t)
					const c = (t > 0.0) ? [0.75,0.05,0.10] : [0.10,0.25,0.75]
					for (let k = 0; k < 3; k++) { colors[3*i+k] = (1-a)*0.95 + a*c[k] }
				}
				geometry.setAttribute( 'color', new THREE.BufferAttribute( colors, 3 ) )

				// 5th to 95th percentile of size by area, which ignores the spike right at each cone
				const order = [...phi.keys()].sort( (a,b) => phi[b]-phi[a] )
				let total = 0.0
				for (let i = 0; i < phi.length; i++) { total += weight[i] }
				let acc = 0.0, lo = null, hi = null
				for (const i of order) {
					acc += weight[i]
					if (lo === null && acc >= 0.05*total) { lo = Math.exp(-phi[i]) }
					if (hi === null && acc >= 0.95*total) { hi = Math.exp(-phi[i]) }
				}
				return lo.toFixed(2) + 'x to ' + hi.toFixed(2) + 'x'
			}

			const LSCM_U = 30
			const LSCM_V = 48

			// The conformal uv map of the current pot, as function(u, v, out) setting out.x
			// (turns around) and out.y (conformal height, same units). v must be in 0..1.
			// Closed form by default; LSCM when params.uv_lscm is on.
			function surfaceUV() {
				if (params.uv_lscm) {
					let fn = sor(surface.spline, params.squash);
					let nv = LSCM_V
					if (params.facet == true) {
						fn = facet(sor(surface.spline, params.squash), params.n_facets, params.twist, params.puff  ) ;
						// put grid columns on the facet edges
						nv = params.n_facets * Math.ceil( LSCM_V/params.n_facets )
					}
					return lscmMap( fn, LSCM_U, nv )
				}
				const U = conformalMap( surface.spline, params.squash )
				// with facets on, facet() puts the point at angle v + u*twist
				const tw = (params.facet == true) ? params.twist : 0.0
				return function( u, v, out ) {
					out.x = v + u*tw
					out.y = U(u)
				}
			}

			function spiralPath(scale_fact) {

				const length_samples = surface.spline.points.length * 10
				const dt = 1.0/(length_samples-1)
				//console.log("dt=",dt)
				const samples = [...Array(length_samples).keys()].map( x => x*dt).map(x => [x,surface.spline.getPoint(x)] )

				const total_length = samples.reduce( function(acc,cv) {
						var d = acc[1] +  cv[1].distanceTo( acc[0] ) 
						return( [ cv[1], d ] ) 
					}, [samples[0][1], 0.0]
				)[1]
				//console.log(total_length)
				//console.log(samples)


				const distances =  samples.reduce( function([ last_p, dv, last_d ],[t,p]) {
						var dd = p.distanceTo( last_p )
						var d = last_d + dd
						dv.push( [t,d] )
						return( [ p, dv, d ] ) 
					}, [samples[0][1], [], 0.0 ]
				)[1]


				const n_layers = Math.floor(total_length/(params.layer_height/scale_fact))
				const n_angular_steps = 1000
				const n = n_layers*n_angular_steps


				//console.log(distances)
				const tv = evenly_spaced_samples( surface.spline, distances,total_length, n )
				//console.log("last tv:",tv.slice(-1))

				const da = 1.0 / (n_angular_steps)
				var i = 0.0
				//console.log("da",da)
			//	console.log("twist",params.twist)

				let fn =  sor(surface.spline, params.squash);
				if (params.facet == true) { 
					//log("faceting on: ", fn); 
					fn = facet(sor(surface.spline, params.squash), params.n_facets, params.twist, params.puff  ) ;
					//log("faceting on:- ", fn); 
				}

				var p = new THREE.Vector3(0, 0, 0)

				// texture: radial sine wave along the toolpath. The wave is a function of the
				// unwrapped angle v (in turns), so the fractional periods per turn produce a
				// phase shift between successive turns of the spiral.
				const texture_on = params.texture && params.texture_amplitude > 0.0
				const texture_periods = params.texture_periods + params.texture_fraction
				const texture_amp = params.texture_amplitude / scale_fact
				// conformal option: take both coordinates from the conformal uv map and use the
				// same number of periods in each, giving a grid of square bumps.
				const uvmap = (texture_on && params.texture_conformal) ? surfaceUV() : null
				const uvpt = new THREE.Vector2()

				var points = tv.map( function(t) {
					var v = i*da - params.twist*t 
					i = i + 1
					return( [t,v]  )
				} ).map( function([u,v]) {
					fn(u,v%1.0,p)
					if (texture_on) {
						const r = Math.sqrt( p.x*p.x + p.z*p.z )
						if (r > 0.0) {
							let s = 0.0
							if (uvmap) {
								// the map wants v in 0..1; add the whole turns back so v stays unwrapped
								const vm = v - Math.floor(v)
								uvmap( u, vm, uvpt )
								s = texture_amp * Math.sin( 2.0*Math.PI * texture_periods * ( uvpt.x + (v-vm) ) ) * Math.sin( 2.0*Math.PI * texture_periods * uvpt.y )
							} else {
								s = texture_amp * Math.sin( 2.0*Math.PI * texture_periods * v )
							}
							const rs = Math.max( 0.0, r + s ) / r
							p.x *= rs
							p.z *= rs
						}
					}
					return p.clone()
//					
				} )

				var p0 = new THREE.Vector3(0,0,0)
				p0 = points[0].clone()

				points = points.map( function(p) { p.y = Math.max(p.y,p0.y); return p } )

				var sp = []
				if (params.bottom) {

//					fn(0,0,p0)
					var p1 = p0.clone()

					p0.x = 0.0 
					p0.z = 0.0

					const r0 = p0.distanceTo(p1)
					console.log("sp")
					var bottom_points = bottomPath(r0,total_length,scale_fact).map( function(p) { p.y += p0.y; return p } )
					//console.log("z")
					//points.map(  function(p) { p.y += params.layer_height/scale_fact }  )
					bottom_points.map( function(p) { p.y -= 2.0*params.layer_height/scale_fact } )
					//points = bottom_points.concat(points.map ( function(p) { p.y += params.layer_height/scale_fact } ) )
					points = bottom_points.concat(points )
					//					points = [ptail].concat( sp_in.concat( sp_out.concat(points ) ) )

				}

				return points

			}

			function exportGcode() {
				const sf = scale_factor()
				const box = bbox()
				const miny = box[1][0]
				// position of center on bed (use 0,0 for delta printer)
//				const tx = 300 
//				const ty = 300

				const tx = 100 
				const ty = 100



//				const tx = 0 
//				const ty = 0
				var tz = params.bed_height + params.layer_height
				if (params.bottom) {
					// inward spiral, raster, outward spiral: three bottom layers under the wall
					tz = params.bed_height + 3.0*params.layer_height
				}
				const sppoints = spiralPath( scale_factor() ).map(function(p) { 
					p.y -= miny //+ (params.bottom ? params.layer_height/scale_factor() :  0.0 )
					return p
				}).map(function(p) { 
					p.x *= sf; p.y *= sf; p.z *= sf; 
					return p
				}).map(function(p) { 
					var w = p.y ; p.y = -p.z ; p.z = w; 
					return p
				}).map(function(p) { 
					p.x += tx;  p.y += ty  ; p.z += tz
					return p
				})


				//" "+p.x+" "+p.y+" "+p.z+"\n" //
				// layer index for PrusaSlicer-style ;LAYER_CHANGE markers: the wall is a
				// continuous spiral, so mark each time Z crosses a layer-height boundary
				const layerIndex = function(z) {
					return Math.floor( (z - params.bed_height) / params.layer_height + 1e-6 )
				}
				const layerChange = function(z) {
					return ";LAYER_CHANGE\n;Z:" + z.toFixed(3) + "\n;HEIGHT:" + params.layer_height + "\n"
				}

				var dd = 0
				var lp = sppoints[0]
				var layer = layerIndex( lp.z )
				var gcode = sppoints.map(
					function(p){ 
					var r = ""
					const l = layerIndex( p.z )
					if (l > layer) {
						r += layerChange( p.z )
						layer = l
					}
					dd += 0.4 * p.distanceTo(lp)
					r += "G1 X"+p.x+" Y"+p.y+" Z"+p.z+" E"+dd+"\n" 
					lp = p 
					return r 
				}
				).reduce( (a,b)=>a+b , "")

			//	console.log(points)
//				const exporter = new OBJExporter();
//G1 E{ext} F900

				const footer = "G1 E"+(dd-0.5)+ " F900\n" + `G92 E0
G91 ; set relative coordination
G1 Z50 F300 ;move 5mm up with 300 speed
G90 ; set absolute coordination
G1 X200  F2400 ; home X axis
`
				var info = ";" + model_json() + "\n"
				info += "; bed_height: " + params.bed_height + "\n"
				info += "; layer_height: " + params.layer_height + "\n"
				info += "; line_width: " + params.line_width + "\n"
				info += "; scale_factor: " + scale_factor() + "\n"
				info += "; set_height: " + params.set_height + (params.set_height ? " (" + params.target_height + " mm)" : "") + "\n"

				const header = `M107
;TYPE:Custom
G28 ; home all axes

G21 ; set units to millimeters
G90 ; use absolute coordinates
M82 ; use absolute distances for extrusion
G92 E0
; Filament gcode
M107
${layerChange( sppoints[0].z )}G1 Z70 F9000
G1 E-.3 F900
G92 E0
G1 E.4 F900
M204 S150
;TYPE:External perimeter
;WIDTH:3
G1 F3360
`;
				const result = info + header + "G1 X"+sppoints[0].x+" Y"+sppoints[0].y+"\n" + gcode + footer

				saveString( result, params.user + "_" + randomID(5) + ".gcode" );

			}

				let tex = gui.addFolder( 'Texture' );
				function textureChanged() {
					if (params.spiralize) {
						updateSplineOutline();
						render();
					}
				}
				tex.add( params, 'texture' ).name( 'Radial sine wave' ).onChange( textureChanged );
				tex.add( params, 'texture_amplitude', 0.0, 5.0 ).name( 'Amplitude (mm)' ).step( 0.1 ).onChange( textureChanged );
				tex.add( params, 'texture_periods', 0, 60 ).name( 'Periods per turn' ).step( 1 ).onChange( textureChanged );
				tex.add( params, 'texture_fraction', 0.0, 1.0 ).name( 'Fractional periods' ).step( 0.01 ).onChange( textureChanged );
				tex.add( params, 'texture_conformal' ).name( 'Square cells (conformal)' ).onChange( textureChanged );
				tex.add( params, 'uv_lscm' ).name( 'LSCM uv map (squash, facets)' ).onChange( function() {
					updateSplineOutline();
					render();
				} );
				function imageChanged() {
					updateSurfaceImage();
					render();
				}
				surface_image_controller = tex.add( params, 'surface_image' ).name( 'Show image on surface' ).onChange( imageChanged );
				tex.add( params, 'image_repeat', 1, 40 ).name( 'Image repeats per turn' ).step( 1 ).onChange( imageChanged );
				tex.add( params, 'loadImage' ).name( 'Load image...' );
				tex.close();

				let sc = gui.addFolder( 'Pattern scale (experiment)' );
				function scaleViewChanged() {
					updateSurfaceImage();
					updateSplineOutline();
					render();
				}
				sc.add( params, 'scale_view', [ 'off', 'uv map', 'cone metric' ] ).name( 'Show pattern size' ).onChange( scaleViewChanged );
				sc.add( params, 'cone_order', { 'p2 (180 deg)': 2, 'p3 (120 deg)': 3, 'p4 (90 deg)': 4, 'p6 (60 deg)': 6 } ).name( 'Lattice symmetry' ).onChange( scaleViewChanged );
				sc.add( params, 'uv_cones' ).name( 'Cone uv layout (seams show)' ).onChange( scaleViewChanged );
				scale_stats_controller = sc.add( params, 'scale_stats' ).name( 'Size range' ).disable();
				sc.close();

				let h = gui.addFolder( 'Export' );
				h.add(params, 'user').name("Name (for labeling files):")
				h.add( params, 'exportToObj' ).name( 'Export OBJ' );
				h.add( params, 'exportGcode' ).name( 'Export Gcode' );
				h.add( params, 'exportJson' ).name( 'Export JSON' );
				h.close()

				let prs = gui.addFolder( '(Expert) Printer Settings' );
				prs.add( params, 'bed_height' , 0.0, 15.0 ).name( 'Bed Height' ).step(0.5);
				prs.add( params, 'layer_height' , 0.0, 3.0 ).name( 'Layer Height' ).step(0.1).onChange( function ( value ) {

				//	splines.uniform.tension = value;
					if (params.spiralize) { 
						updateSplineOutline();
						render();
					}

				} );
				prs.add( params, 'line_width' , 0.0, 3.0 ).name( 'Line Width' ).step(0.1).onChange( function ( value ) {

					//	splines.uniform.tension = value;
						if (params.spiralize) { 
							updateSplineOutline();
							render();
						}

					} );
				function scaleChanged() {
					if (params.spiralize) {
						updateSplineOutline();
						render();
					}
				}
				prs.add( params, 'set_height' ).name( 'Set height manually' ).onChange( scaleChanged );
				prs.add( params, 'target_height', 10.0, 250.0 ).name( 'Height (mm)' ).step( 1.0 ).onChange( scaleChanged );
				prs.close();
				gui.close();

				/*******
				 * Curves
				 *********/

				for ( let i = 0; i < splinePointsLength; i ++ ) {

					addSplineObject( positions[ i ] );

				}

				positions.length = 0;

				for ( let i = 0; i < splinePointsLength; i ++ ) {

					positions.push( splineHelperObjects[ i ].position );

				}

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute( 'position', new THREE.BufferAttribute( new Float32Array( ARC_SEGMENTS * 3 ), 3 ) );

				let curve = new THREE.CatmullRomCurve3( positions );
				curve.curveType = 'catmullrom';
				curve.mesh = new THREE.Line( geometry.clone(), new THREE.LineBasicMaterial( {
					color: 0xff0000,
					opacity: 0.35
				} ) );
				curve.mesh.castShadow = true;
				splines.uniform = curve;

				curve = new THREE.CatmullRomCurve3( positions );
				curve.curveType = 'centripetal';
				curve.mesh = new THREE.Line( geometry.clone(), new THREE.LineBasicMaterial( {
					color: 0x00ff00,
					opacity: 0.35
				} ) );
				curve.mesh.castShadow = true;
				splines.centripetal = curve;

				surface.spline = curve.clone();

				let fn =  sor(curve, params.squash);
				if (params.facet == true) { //log("faceting on", fn); 
					fn = facet(sor(curve, params.squash), params.n_facets, params.twist , params.puff );  }
				surface.geometry = new ParametricGeometry( fn , ARC_SEGMENTS, ANGLE_SEGMENTS );
				surface.mesh = new THREE.Mesh( surface.geometry,  new THREE.MeshBasicMaterial( { color: 0x00ff00 } ) ); 

				curve = new THREE.CatmullRomCurve3( positions );
				curve.curveType = 'chordal';
				curve.mesh = new THREE.Line( geometry.clone(), new THREE.LineBasicMaterial( {
					color: 0x0000ff,
					opacity: 0.35
				} ) );
				curve.mesh.castShadow = true;
				splines.chordal = curve;


				for ( const k in splines ) {

					const spline = splines[ k ];
					scene.add( spline.mesh );

				}
				scene.add( surface.mesh )
				

				load(
					[new THREE.Vector3(289.76843686945404, 0, 0),
					new THREE.Vector3(414.91846107193595, 191.8845958690277, 0),
					new THREE.Vector3(449.8551731144292, 466.07527141050946, 0),
					new THREE.Vector3(445.835534762008, 698.9204108718246, 0)]
				);	
			

				// Controls
				const controls = new OrbitControls( camera, renderer.domElement );
				controls.damping = 0.2;
				controls.addEventListener( 'change', render,  { passive: false } );

				transformControl = new TransformControls( camera, renderer.domElement );
				transformControl.showZ = false;
				transformControl.addEventListener( 'change', render,  { passive: false } );
				transformControl.addEventListener( 'dragging-changed', function ( event ) {

					controls.enabled = ! event.value;

				},  { passive: false } );
				scene.add( transformControl );
				//transformControl.update();

				transformControl.addEventListener( 'objectChange', function () {

					updateSplineOutline();

				} );
				controls.update();

				document.addEventListener( 'pointerdown', onPointerDown );
				document.addEventListener( 'pointerup', onPointerUp );
				document.addEventListener( 'pointermove', onPointerMove );
				window.addEventListener( 'resize', onWindowResize );

				var rgbl = new RGBELoader()
					.setPath( 'textures/' )
//					.load( 'quarry_01_1k.hdr', function ( texture ) {
					.load( 'venice_sunset_1k.hdr', function ( texture ) {
						texture.mapping = THREE.EquirectangularReflectionMapping;
						scene.background = texture;
						scene.environment = texture;
					} ) ;
				console.log(rgbl)

				render();

				rgbl.needsPMREMUpdate = true

				//controls.update();
				//renderer.render( scene, camera );


			}

			function addSplineObject( position ) {

//				const material = new THREE.MeshLambertMaterial( { color: Math.random() * 0xffffff } );
				const object = new THREE.Mesh( geometry, splineHelperObjects.length==0 ? handle_material1 : handle_material );

				if ( position ) {

					object.position.copy( position );

				} else {

					var maxy = splineHelperObjects.map( x => x.position.y ).reduce(
					(acc,val)=>{ if (val>acc) {return val} else {return acc} }, -100000.0
				    );

					object.position.x = Math.random() * 400 + 100;
					object.position.y = 1.1*maxy;
					object.position.z = 0.0;

				}

				object.castShadow = true;
				object.receiveShadow = true;
				scene.add( object );
				splineHelperObjects.push( object );
				return object;

			}

			function addPoint() {

				splinePointsLength ++;

				positions.push( addSplineObject().position );

				updateSplineOutline();

				render();

			}

			function removePoint() {

				if ( splinePointsLength <= 4 ) {

					return;

				}

				const point = splineHelperObjects.pop();
				splinePointsLength --;
				positions.pop();

				if ( transformControl.object === point ) transformControl.detach();
				scene.remove( point );

				updateSplineOutline();

				render();

			}

			function enforceFirstPointBottom() {

				var firstY = splineHelperObjects[0].position.y
				
				for (const si in splineHelperObjects) {
					var s = splineHelperObjects[si]
					s.position.y = Math.max(firstY,s.position.y)
				}
			}

			function updateSplineOutline() {
				

				for ( const k in splines ) {

					const spline = splines[ k ];

					const splineMesh = spline.mesh;
					const position = splineMesh.geometry.attributes.position;

					for ( let i = 0; i < ARC_SEGMENTS; i ++ ) {

						const t = i / ( ARC_SEGMENTS - 1 );
						spline.getPoint( t, point );
						position.setXYZ( i, point.x, point.y, point.z );

					}

					position.needsUpdate = true;

				}

				scene.remove(surface.mesh);
				surface.spline = splines.centripetal;//['centripital'];
				//console.log( "spline:", surface.spline );


				let fn =  sor(surface.spline, params.squash);
				if (params.facet == true) { 
					//log("faceting on: ", fn); 
					fn = facet(sor(surface.spline, params.squash), params.n_facets, params.twist, params.puff  ) ;
					//log("faceting on:- ", fn); 

				}
				//surface.geometry = new ParametricGeometry( fn , ARC_SEGMENTS, ANGLE_SEGMENTS );

				surface.geometry = new ParametricGeometry( fn , ARC_SEGMENTS, ANGLE_SEGMENTS );

				// replace ParametricGeometry's (u,v) texture coordinates with conformal ones:
				// x = angle around the pot in turns, y = conformal height U in the same units,
				// so the map keeps its true aspect ratio (y is not normalized to 0..1).
				// These go out in the OBJ export as vt lines.
				let cm = null
				if (params.uv_cones || params.scale_view == 'cone metric') {
					let nv = CONE_V
					if (params.facet == true) { nv = params.n_facets * Math.ceil( CONE_V/params.n_facets ) }
					cm = coneMetric( fn, CONE_U, nv, params.cone_order )
				}
				let param_uv = null   // the surface parameters (u,v) of each vertex
				if (params.uv_cones) {
					// cone layout (experiment): the mesh is replaced by one cut open along the seams
					const lay = coneLayout( cm )
					surface.geometry = lay.geometry
					param_uv = lay.param_uv
				} else {
					const uvmap = surfaceUV()
					const uvpt = new THREE.Vector2()
					const puv = surface.geometry.attributes.uv
					param_uv = new Float32Array( puv.array )
					for ( let i = 0; i < puv.count; i ++ ) {
						uvmap( puv.getX(i), puv.getY(i), uvpt )
						puv.setXY( i, uvpt.x, uvpt.y )
					}
					puv.needsUpdate = true
				}
				const uv = surface.geometry.attributes.uv

				// pattern size heat map (experiment): of the uv map on the mesh, or of the cone metric
				let cone_markers = (cm !== null) ? cm.cones : []
				if (params.scale_view == 'uv map') {
					const ls = uvLogScale( surface.geometry )
					params.scale_stats = paintLogScale( surface.geometry, ls.phi, ls.weight )
				} else if (params.scale_view == 'cone metric') {
					const phi = new Float64Array( uv.count )
					for ( let i = 0; i < uv.count; i ++ ) {
						phi[i] = cm.phi( param_uv[2*i], param_uv[2*i+1] )
					}
					const ls = uvLogScale( surface.geometry )
					const npos = cm.cones.filter( c => c.sign > 0 ).length
					params.scale_stats = paintLogScale( surface.geometry, phi, ls.weight ) + ', cones +' + npos + ' -' + (cm.cones.length-npos)
				}
				if (scale_stats_controller !== null) { scale_stats_controller.updateDisplay() }

				surface.mesh = new THREE.Mesh( surface.geometry, surface_material );

				surface.mesh.receiveShadow = true;

				// cones: black where the pattern loses a sector (positive curvature), green where it gains one
				for (const c of cone_markers) {
					const marker = new THREE.Mesh( new THREE.SphereGeometry( 9, 12, 8 ), new THREE.MeshBasicMaterial( { color: (c.sign > 0) ? 0x000000 : 0x00dd44 } ) )
					marker.position.copy( c.p )
					surface.mesh.add( marker )
				}


				if (params.bottom == true) {
					var p0 = new THREE.Vector3(0,0,0)
					fn(0,0,p0)
					p0.x = 0.0 
					p0.z = 0.0
					const n = 100 
					const ds = 1.0/n
					var points = [...Array(n).keys()].map( function(x){ var p = new THREE.Vector3(0,0,0); fn(0,x*ds,p);  return p } )
					var positions = [...Array(n).keys()].flatMap( function(i){//
						return [ p0, points[i], points[(i+1)%n] ]
					} ) //.flatMap( p => [p.x,p.y,p.z])

					var bgeom = new THREE.BufferGeometry().setFromPoints( positions )
					bgeom.computeVertexNormals();
					var bottom = new THREE.Mesh( bgeom ); 
			//		console.log(bottom_material)
				//	bottom.material.color.setHex(0xaaaaaa); 
				
					bottom.material = //.color.setHex(0xffff00); // = bottom_material
						new THREE.MeshStandardMaterial( { 	
						color: 0xaaaaaa,
						roughness: 1.0,
						metalness: 0.0 } 
					);
					bottom.material.side = THREE.DoubleSide;
					bottom.receiveShadow = true;
					bottom.material.needsUpdate=true
					surface.mesh.add(bottom)

				}

				scene.add(surface.mesh);

				if (params.spiralize) {
					const line_material = new THREE.LineBasicMaterial( { color: 0x0000ff } );

					const sppoints = spiralPath( scale_factor() )
					var line_geometry = new THREE.BufferGeometry().setFromPoints( sppoints );
					//points3D.vertices.push(sppoints)
					//var spiral = new THREE.Geometry();
					const line = new THREE.Line( line_geometry, line_material );
					//var line2 = new THREE.Line(points3D, new THREE.LineBasicMaterial({color: "red"}));
					surface.mesh.add(line);


				}

				renderer.render( scene, camera );
			//	bbox()


			}

			function model_json() {
				const strplace = [];

				for ( let i = 0; i < splinePointsLength; i ++ ) {

					const p = splineHelperObjects[ i ].position;
					strplace.push( `new THREE.Vector3(${p.x}, ${p.y}, ${p.z})` );

				}

				//console.log( strplace.join( ',\n' ) );
				//const code = '[' + ( strplace.join( ',\n\t' ) ) + ']';
				let ppp = {};
				ppp.facet = params.facet;
				ppp.n_facets = params.n_facets;
				ppp.points = splineHelperObjects.map( x => ({ x: x.position.x , y: x.position.y }) ) ;
				ppp.puff = params.puff;
				ppp.squash = params.squash;
				ppp.twist = params.twist;
				ppp.texture = params.texture;
				ppp.texture_amplitude = params.texture_amplitude;
				ppp.texture_periods = params.texture_periods;
				ppp.texture_fraction = params.texture_fraction;
				ppp.texture_conformal = params.texture_conformal;
				ppp.uv_lscm = params.uv_lscm;
				ppp.surface_image = params.surface_image;
				ppp.image_repeat = params.image_repeat;
				ppp.scale_view = params.scale_view;
				ppp.cone_order = params.cone_order;
				ppp.uv_cones = params.uv_cones;
				ppp.set_height = params.set_height;
				ppp.target_height = params.target_height;
				ppp.npoints = ppp.points.length;
				return JSON.stringify( ppp )
			}


			function load( new_positions ) {

				while ( new_positions.length > positions.length ) {

					addPoint();

				}

				while ( new_positions.length < positions.length ) {

					removePoint();

				}

				for ( let i = 0; i < positions.length; i ++ ) {

					positions[ i ].copy( new_positions[ i ] );

				}

				updateSplineOutline();

			}

			function render() {
				splines.uniform.mesh.visible = params.uniform;
				splines.centripetal.mesh.visible = params.centripetal;
				splines.chordal.mesh.visible = params.chordal;
				renderer.render( scene, camera );
			}

			function onPointerDown( event ) {
				onDownPosition.x = event.clientX;
				onDownPosition.y = event.clientY;

				pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

				//	log("pointerdown",[onDownPosition,pointer])
				/*
					console.log("maxy:", splineHelperObjects.map( x => x.position.y ).reduce(
						(acc,val)=>{ if (val>acc) {return val} else {return acc} }, -100000.0
					) )
				*/
				raycaster.setFromCamera( pointer, camera );

				const intersects = raycaster.intersectObjects( splineHelperObjects, false );

				if ( intersects.length > 0 ) {
				//	log("intersection",intersects[ 0 ].object)

					const object = intersects[ 0 ].object;

					if ( object !== transformControl.object ) {

						transformControl.attach( object );

					}

				}


			}

			function onPointerUp() {
			//	log("pointerup",event)

				onUpPosition.x = event.clientX;
				onUpPosition.y = event.clientY;

				//if ( onDownPosition.distanceTo( onUpPosition ) === 0 ) transformControl.detach();
			//	console.log(params)
	//			console.log( splineHelperObjects.map( x => ({ x: x.position.x , y: x.position.y }) ) )
			}

			function onPointerMove( event ) {

			//	log("pointermove",event)
				pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

				enforceFirstPointBottom()
			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

		//	updateSplineOutline();

	//		render();

		</script>
